<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administratora testi</title>
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; min-height: 100vh; }
        .admin-container { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-right: 1px solid rgba(0,0,0,0.08); padding: 2rem 1rem; position: fixed; height: 100vh; overflow-y: auto; }
        .logo h1 { color: #667eea; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .logo p { color: #666; font-size: 0.95rem; }
        .nav-menu { list-style: none; margin: 0; padding: 0; }
        .nav-item { margin-bottom: 0.5rem; }
        .nav-link { display: flex; align-items: center; padding: 0.95rem 1rem; border-radius: 14px; color: #333; text-decoration: none; transition: all 0.2s ease; }
        .nav-link:hover, .nav-link.active { background: rgba(102,126,234,0.15); color: #2f55d4; }
        .main-content { flex: 1; margin-left: 280px; padding: 2rem; }
        .page-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
        .page-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .page-header p { color: #555; font-size: 1rem; }
        .button-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.1rem; border-radius: 999px; text-decoration: none; color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); border: none; cursor: pointer; }
        .btn-success { background: linear-gradient(135deg, #28a745, #20c997); }
        .btn-secondary { background: rgba(0,0,0,0.08); color: #333; }
        .table-container { background: rgba(255,255,255,0.95); border-radius: 20px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,0.08); }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 1rem; border-bottom: 1px solid #e9ecef; text-align: left; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 1rem; }
        .modal-content { background: #fff; width: 100%; max-width: 520px; border-radius: 16px; padding: 1.75rem; box-shadow: 0 20px 60px rgba(0,0,0,0.12); }
        @media (max-width: 900px) { .admin-container { flex-direction: column; } .sidebar { position: relative; width: 100%; height: auto; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
<div class="admin-container">
<aside class="sidebar"><div class="logo"><h1>🌐 LinguaAdmin</h1><p>Administratora panelis</p></div><ul class="nav-menu"><li class="nav-item"><a href="admin_dashboard.html" class="nav-link">📊 Pārskats</a></li><li class="nav-item"><a href="admin_users.html" class="nav-link">👥 Lietotāji</a></li><li class="nav-item"><a href="admin_tests.html" class="nav-link active">📝 Testi</a></li></ul></aside>
<main class="main-content">
    <div class="page-header">
        <h1>Testu pārvaldība</h1>
        <p>Pievieno un rediģē testus.</p>
        <div class="button-row">
            <a class="btn btn-success" href="admin_users.html">Pievienot jaunu lietotāju</a>
            <a class="btn btn-secondary" href="admin_dashboard.html">🏠 Atpakaļ uz pārskatu</a>
        </div>
    </div>
    <div class="button-row" style="margin-bottom:1rem;">
        <a class="btn btn-success" id="openAddTest">Izveidot testu</a>
    </div>
    <div style="margin-bottom:0.75rem; display:flex; gap:0.75rem; align-items:center;">
        <label style="font-weight:600;">Filtrēt pēc valodas:</label>
        <select id="filterLang" style="min-width:180px;"><option value="">Visas valodas</option></select>
    </div>
    <table class="table"><thead><tr><th>ID</th><th>Nosaukums</th><th>Valoda</th><th>Temats</th><th>Darbības</th></tr></thead><tbody id="testsBody"><tr><td colspan="5" style="text-align:center;color:#666">Ielādē...</td></tr></tbody></table>
</main>
</div>

<div id="addTestModal" class="modal"><div class="modal-content"><h2>Izveidot testu</h2>
    <form id="addTestForm">
        <div style="margin-bottom:.5rem;"><label>Nosaukums</label><input name="test_name" required style="width:100%"></div>
        <div style="margin-bottom:.5rem;"><label>Valoda</label><select name="language_id" id="testLang"></select></div>
        <div style="margin-bottom:.5rem;"><label>Temats</label><input name="topic_name" id="testTopicName" required style="width:100%" placeholder="Piemēram: Past Simple"></div>

        <div id="questionsContainer"></div>
        <div style="margin-top:.75rem; display:flex; gap:.5rem;">
            <button type="button" class="btn btn-secondary" id="addQuestionBtn">Pievienot jautājumu</button>
        </div>

        <div style="margin-top:1rem; display:flex; gap:.5rem; justify-content:flex-end;">
            <button class="btn btn-success" type="submit">Saglabāt testu</button>
            <button class="btn btn-secondary" type="button" id="cancelTest">Atcelt</button>
        </div>
    </form>
</div></div>

<script>
function getAdminAuthHeaders(additionalHeaders = {}) {
    const token = localStorage.getItem('adminSessionToken');
    return token ? Object.assign({'Authorization': `Bearer ${token}`}, additionalHeaders) : additionalHeaders;
}

async function loadTests(){
    try{
        const lang = document.getElementById('filterLang') ? document.getElementById('filterLang').value : '';
        const url = 'get_tests.php' + (lang ? ('?language_id=' + encodeURIComponent(lang)) : '');
        const r = await fetch(url);
        const d = await r.json();
        if(d.success){
            document.getElementById('testsBody').innerHTML = d.tests.map(t=>`<tr><td>${t.id}</td><td>${escapeHtml(t.test_name)}</td><td>${escapeHtml(t.language_name||'')}</td><td>${escapeHtml(t.topic_name||'')}</td><td><button data-id="${t.id}" class="delTest">Dzēst</button> <button data-id="${t.id}" class="editTest">Rediģēt</button></td></tr>`).join('');
            document.querySelectorAll('.delTest').forEach(b=>b.addEventListener('click', e=>deleteTest(e.target.dataset.id)));
            document.querySelectorAll('.editTest').forEach(b=>b.addEventListener('click', e=>openEditTest(e.target.dataset.id)));
        } else {
            document.getElementById('testsBody').innerHTML = '<tr><td colspan="5">Neizdevās ielādēt</td></tr>';
        }
    }catch(e){console.error(e);}
}

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadTestMeta(){
    try{
        const la = await fetch('get_languages.php', { headers: getAdminAuthHeaders() }).then(r=>r.json());
        if(la.success) document.getElementById('testLang').innerHTML = la.languages.map(l=>`<option value="${l.language_id}">${l.language_name}</option>`).join('');
        if(la.success){
            const filter = document.getElementById('filterLang');
            if (filter && filter.options.length === 1) {
                filter.insertAdjacentHTML('beforeend', la.languages.map(l=>`<option value="${l.language_id}">${l.language_name}</option>`).join(''));
                filter.addEventListener('change', ()=>loadTests());
            }
        }
    }catch(e){console.error(e)}
}

async function deleteTest(id){
    if(!confirm('Dzēst testu?')) return;
    await fetch('delete_test.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test_id:id})});
    loadTests();
}

document.getElementById('openAddTest').addEventListener('click', e=>{ e.preventDefault(); loadTestMeta(); openCreateModal(); });
document.getElementById('cancelTest').addEventListener('click', ()=>closeModal());
document.getElementById('addQuestionBtn').addEventListener('click', ()=>addQuestionUI());
function openCreateModal(){
    document.getElementById('addTestForm').reset();
    document.getElementById('questionsContainer').innerHTML = '';
    addQuestionUI();
    document.getElementById('addTestModal').style.display = 'flex';
}
function closeModal(){ document.getElementById('addTestModal').style.display = 'none'; }

function addQuestionUI(prefill){
    const idx = document.querySelectorAll('.question-block').length + 1;
    const container = document.getElementById('questionsContainer');
    const div = document.createElement('div');
    div.className = 'question-block';
    div.style.border = '1px solid #eee';
    div.style.padding = '0.75rem';
    div.style.marginTop = '0.75rem';
    div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>Jautājums ${idx}</strong>
            <div>
                <button type="button" class="btn btn-secondary remove-question">Noņemt</button>
            </div>
        </div>
        <div style="margin-top:.5rem;"><textarea name="q_text" rows="2" style="width:100%" placeholder="Jautājuma teksts"></textarea></div>
        <div class="answers-list" style="margin-top:.5rem;"></div>
        <div style="margin-top:.5rem; display:flex; gap:.5rem;"><button type="button" class="btn btn-secondary add-answer">Pievienot atbildi</button></div>
    `;
    container.appendChild(div);

    // assign unique radio group name for this question
    const radioGroupName = 'correct_' + Math.random().toString(36).substr(2,8);
    div.dataset.radioName = radioGroupName;
    div.querySelector('.remove-question').addEventListener('click', ()=>{ div.remove(); refreshQuestionTitles(); });
    div.querySelector('.add-answer').addEventListener('click', ()=>addAnswerUI(div));

    if(prefill && prefill.answers){
        div.querySelector('textarea[name="q_text"]').value = prefill.text || '';
        prefill.answers.forEach(a=>addAnswerUI(div, a));
    } else {
        addAnswerUI(div);
        addAnswerUI(div);
    }
}

function refreshQuestionTitles(){ document.querySelectorAll('.question-block').forEach((b,i)=> b.querySelector('strong').textContent = `Jautājums ${i+1}`); }

function addAnswerUI(questionDiv, prefill){
    const list = questionDiv.querySelector('.answers-list');
    const idx = list.children.length + 1;
    const item = document.createElement('div');
    item.style.display = 'flex'; item.style.gap='0.5rem'; item.style.marginTop='0.5rem'; item.style.alignItems='center';
    const radioName = questionDiv.dataset.radioName || ('correct_' + Math.random().toString(36).substr(2,5));
    item.innerHTML = `<input type="radio" name="${radioName}" class="correct-radio"> <input type="text" class="answer-text" style="flex:1" placeholder="Atbildes teksts"> <button type="button" class="btn btn-secondary remove-answer">Noņemt</button>`;
    list.appendChild(item);
    if(prefill){ item.querySelector('.answer-text').value = prefill.text || ''; if(prefill.is_correct) item.querySelector('.correct-radio').checked = true; }
    item.querySelector('.remove-answer').addEventListener('click', ()=>{ item.remove(); });
}

document.getElementById('addTestForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const form = e.target;
    const testName = form.test_name.value.trim();
    const languageId = form.language_id.value;
    const topicName = form.topic_name.value.trim();
    if(!testName || !languageId || !topicName){ alert('Ievadiet nosaukumu, valodu un tematu.'); return; }

    const questions = Array.from(document.querySelectorAll('.question-block')).map(qb=>{
        const text = qb.querySelector('textarea[name="q_text"]').value.trim();
        const answers = Array.from(qb.querySelectorAll('.answers-list .answer-text')).map((el, i)=>{
            const radio = qb.querySelectorAll('.answers-list .correct-radio')[i];
            return { text: el.value, is_correct: !!radio.checked };
        });
        return { text, type: 'single', answers };
    }).filter(q=>q.text.length>0 && q.answers.length>0);

    const payload = { test_name: testName, language_id: languageId, topic_name: topicName, questions };
    const res = await fetch('add_test.php', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if(data.success){ closeModal(); loadTests(); } else { alert(data.error || 'Kļūda'); }
});

async function openEditTest(id){
    try{
        const r = await fetch('get_test.php?test_id='+encodeURIComponent(id));
        const d = await r.json();
        if(!d.success) return alert('Nevar ielādēt testu');
        document.getElementById('addTestForm').reset();
        document.getElementById('testLang').value = d.test.language_id;
        document.getElementById('testTopicName').value = d.test.topic_name || '';
        document.getElementById('questionsContainer').innerHTML='';
        (d.questions||[]).forEach(q=> addQuestionUI({ text: q.question_text, answers: q.answers.map(a=>({ text: a.answer_text, is_correct: a.is_correct })) }));
        document.getElementById('addTestModal').style.display = 'flex';
        // Note: editing existing test is not yet wired to update endpoint.
    }catch(e){console.error(e)}
}

window.addEventListener('DOMContentLoaded', ()=>{ loadTestMeta(); loadTests(); });
</script>
</body>
</html>
