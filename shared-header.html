<!-- Shared Header for all pages -->
<header class="header">
    <div class="container">
        <div class="header-container">
            <a href="{basePath}index.html" class="logo">Valodu apguves platforma</a>
            
            <nav class="main-nav">
                <div class="nav-links">
                    <a href="{basePath}index.html" class="nav-link" data-home-link>Sākums</a>
                    <a href="{basePath}about.html" class="nav-link">Par mums</a>
                    <a href="{basePath}contact.html" class="nav-link">Kontakti</a>
                </div>

                <!-- User Profile / Auth Section -->
                <div id="userProfileNav" class="user-profile-nav" style="display: none;">
                    <a href="{basePath}profile.html" class="profile-link" aria-label="Profils" title="Profils">
                        <div class="profile-avatar-small" id="headerProfileAvatar">U</div>
                        <span id="headerUsername" class="profile-username">Lietotājs</span>
                    </a>
                </div>

                <div id="authButtons" class="auth-buttons">
                    <a href="{basePath}login.html" class="nav-link" style="background-color: rgba(79, 70, 229, 0.1); padding: 0.5rem 1rem;">Pieteikšanās</a>
                    <a href="{basePath}signup.html" class="nav-link" style="background-color: #4f46e5; color: white; padding: 0.5rem 1rem;">Reģistrēšanās</a>
                </div>

                <!-- Theme Toggle -->
                <div class="theme-toggle">
                    <span class="icon">🌙</span>
                    <label class="switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </nav>
        </div>
    </div>
</header>
